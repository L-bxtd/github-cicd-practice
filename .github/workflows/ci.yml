# 实验二 6.2：Node.js 最小 CI（本仓库为纯静态页，暂无 package.json，npm 脚本用 --if-present 兜底）
name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --if-present
      - run: npm run lint --if-present && npm test --if-present --ci
      - run: npm run build --if-present
      - name: 校验静态产物
        run: test -f dist/index.html
